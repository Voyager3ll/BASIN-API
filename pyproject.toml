[project]
name = "basin-api"
version = "0.1.0"
description = "BASIN: SWAT-driven basin-wide nutrient scenario API for the Upper Mississippi River Basin"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pandas>=2.1",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["basin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
